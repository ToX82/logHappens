<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - LogHappens</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/layout.css">
    <style>
        .offline-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .offline-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 3rem;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            max-width: 500px;
            width: 90%;
        }
        .offline-icon {
            font-size: 4rem;
            color: #6c757d;
            margin-bottom: 1.5rem;
        }
        .offline-title {
            color: #343a40;
            font-weight: 600;
            margin-bottom: 1rem;
        }
        .offline-text {
            color: #6c757d;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        .retry-btn {
            background: linear-gradient(45deg, #0D47A1, #1976D2);
            border: none;
            color: white;
            padding: 12px 30px;
            border-radius: 25px;
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(13, 71, 161, 0.3);
        }
        .retry-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(13, 71, 161, 0.4);
            color: white;
        }
        .cached-content {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid #e9ecef;
        }
        .cached-content h5 {
            color: #495057;
            margin-bottom: 1rem;
        }
        .cached-links {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .cached-link {
            color: #0D47A1;
            text-decoration: none;
            padding: 0.5rem;
            border-radius: 8px;
            transition: background-color 0.2s ease;
        }
        .cached-link:hover {
            background-color: #f8f9fa;
            color: #0D47A1;
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-card">
            <div class="offline-icon">
                📡
            </div>
            <h1 class="offline-title">You're Offline</h1>
            <p class="offline-text">
                It looks like you've lost your internet connection.
                Don't worry - LogHappens has cached some content for offline viewing.
            </p>

            <button class="btn retry-btn" onclick="window.location.reload()">
                <i class="fas fa-sync-alt me-2"></i>
                Try Again
            </button>

            <div class="cached-content">
                <h5>Available Offline:</h5>
                <div class="cached-links">
                    <a href="/" class="cached-link">
                        <i class="fas fa-home me-2"></i>
                        Home Page
                    </a>
                    <a href="/?view=logs" class="cached-link">
                        <i class="fas fa-file-alt me-2"></i>
                        View Logs (Cached)
                    </a>
                    <a href="/?view=settings" class="cached-link">
                        <i class="fas fa-cog me-2"></i>
                        Settings
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Check connection status
        function checkConnection() {
            if (navigator.onLine) {
                window.location.reload();
            }
        }

        // Listen for online event
        window.addEventListener('online', checkConnection);

        // Check connection every 5 seconds
        setInterval(checkConnection, 5000);
    </script>
</body>
</html>
